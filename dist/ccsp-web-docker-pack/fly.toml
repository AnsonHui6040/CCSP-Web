# fly.toml — CCSP Web Fly.io configuration
#
# Single-machine deployment to keep SQLite writes safe.
# Do NOT scale to multiple machines — SQLite does not support concurrent
# writers from separate processes / VMs.
#
# First-time setup:
#   fly launch          # only needed once; creates the app and volume
#   fly deploy          # builds image and deploys
#   fly ssh console     # run init-db + scrape inside the machine

app = "ccsp-web"
primary_region = "nrt"

[build]
  # Uses the Dockerfile at repo root.

# ── Runtime environment ──────────────────────────────────────────────────────
[env]
  NODE_ENV         = "production"
  DATABASE_PATH    = "/app/data/ccsp.sqlite"
  CCSP_DB_PATH     = "/app/data/ccsp.sqlite"
  CCSP_DATA_DIR    = "/app/data"
  IMPORTER_PYTHON  = "/app/importer/.venv/bin/python"
  PORT             = "3000"

# ── Persistent volume ────────────────────────────────────────────────────────
# The ccsp_data volume must be created before first deploy:
#   fly volumes create ccsp_data --region nrt --size 3
[[mounts]]
  source      = "ccsp_data"
  destination = "/app/data"

# ── HTTP service ─────────────────────────────────────────────────────────────
[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  # Keep exactly one machine running — do not allow Fly to scale out.
  min_machines_running = 1
  processes            = ["app"]

  [[http_service.checks]]
    interval   = "30s"
    timeout    = "5s"
    grace_period = "10s"
    method     = "GET"
    path       = "/"

# ── VM size ───────────────────────────────────────────────────────────────────
[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
