services:
  ccsp-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ccsp-web:local
    container_name: ccsp-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_PATH: /app/data/ccsp.sqlite
      CCSP_DB_PATH: /app/data/ccsp.sqlite
      CCSP_DATA_DIR: /app/data
      IMPORTER_PYTHON: /app/importer/.venv/bin/python
    volumes:
      - ccsp-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ccsp-data:
