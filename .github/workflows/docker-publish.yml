name: CI / Docker Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ansonhui6040/ccsp-web

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: TypeScript typecheck
  # ─────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tsc --noEmit
        working-directory: web
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Web tests (Vitest)
  # ─────────────────────────────────────────────────────────────────────────
  web-tests:
    name: Web tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run Vitest
        working-directory: web
        run: npx vitest run --pool threads

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Python tests (pytest)
  # ─────────────────────────────────────────────────────────────────────────
  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: importer/requirements.txt

      - name: Install dependencies
        working-directory: importer
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: importer
        run: python -m pytest -q

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Build and push Docker image to GHCR
  # Only runs on push to main (not on PRs), after all tests pass.
  # ─────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: [typecheck, web-tests, python-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
